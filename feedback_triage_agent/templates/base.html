<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Feedback Triage Agent{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Crect x='7' y='7' width='5' height='18' fill='%238fb8ff'/%3E%3Crect x='14' y='7' width='5' height='18' fill='%2379d0bd'/%3E%3Crect x='21' y='7' width='5' height='18' fill='%23f0bc70'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Feedback Triage Agent</span>
    </a>
    <div class="topbar-meta">
      <span class="status-badge status-local">Local Web App</span>
      <span>v{{ version }}</span>
    </div>
  </header>

  <aside class="sidebar" aria-label="后台导航">
    <nav>
      {% block sidebar_nav %}
      <a href="/" class="sidebar-link is-active">
        <span class="nav-icon nav-icon-dashboard" aria-hidden="true"></span>
        <span>总览</span>
      </a>
      <a href="/#run-form" class="sidebar-link">
        <span class="nav-icon nav-icon-run" aria-hidden="true"></span>
        <span>运行 Agent</span>
      </a>
      <a href="/#ask-entry" class="sidebar-link">
        <span class="nav-icon nav-icon-log" aria-hidden="true"></span>
        <span>自然语言 Ask</span>
      </a>
      <a href="/#data-source" class="sidebar-link">
        <span class="nav-icon nav-icon-source" aria-hidden="true"></span>
        <span>数据源</span>
      </a>
      <a href="/#run-options" class="sidebar-link">
        <span class="nav-icon nav-icon-options" aria-hidden="true"></span>
        <span>运行选项</span>
      </a>
      <a href="/#reports" class="sidebar-link">
        <span class="nav-icon nav-icon-files" aria-hidden="true"></span>
        <span>输出文件</span>
      </a>
      {% endblock %}
    </nav>
    <div class="sidebar-note">
      {% block sidebar_note %}
      <strong>边界</strong>
      <span>Ask 可由 DeepSeek 解析；反馈初稿和高风险样本仍受本地规则与人工复核约束。</span>
      {% endblock %}
    </div>
  </aside>

  <main class="main" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
