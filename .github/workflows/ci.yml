name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: triage_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d triage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI service only; no cloud or production credentials.
      TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/triage_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reproduce public review preparation and source QA
        run: |
          python scripts/prepare_ai_app_reviews.py
          python scripts/label_quality_check.py
          python scripts/summarize_reviews.py
          git diff --exit-code -- data/ai_app_reviews.csv data/ai_app_feedback docs/ai_app_feedback/source

      - name: Trace public reviews through the existing rules engine
        run: |
          python -m feedback_triage_agent.cli run --input data/ai_app_reviews.csv --output data/ai_app_feedback/generated/triage --no-llm
          python scripts/compare_ai_app_labels.py
          git diff --exit-code -- data/ai_app_feedback/generated/label_comparison.csv

      - name: Run pytest
        run: python -m pytest

      - name: Run evaluation harness
        run: python -m feedback_triage_agent.cli harness --output data/harness_output_ci --skip-pytest

      - name: Upload harness output
        if: ${{ always() && hashFiles('data/harness_output_ci/**') != '' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: harness-output
          path: data/harness_output_ci/
