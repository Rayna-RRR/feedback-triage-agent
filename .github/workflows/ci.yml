name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run evaluation harness
        run: python -m feedback_triage_agent.cli harness --output data/harness_output_ci --skip-pytest

      - name: Upload harness output
        if: ${{ always() && hashFiles('data/harness_output_ci/**') != '' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: harness-output
          path: data/harness_output_ci/
