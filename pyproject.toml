[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-triage-agent"
version = "0.3.0"
description = "A local CLI demo for AI product feedback triage agent workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "pydantic>=2.5",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
feedback-triage-agent = "feedback_triage_agent.cli:main"

[tool.setuptools.packages.find]
include = ["feedback_triage_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
