[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-triage-agent"
version = "0.8.3"
description = "A local CLI demo for AI product feedback triage agent workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<0.116",
    "jinja2>=3.1,<4",
    "typer>=0.12",
    "pandas>=2.0",
    "pydantic>=2.5",
    "python-multipart>=0.0.9,<0.1",
    "rich>=13.0",
    "uvicorn>=0.29,<0.35",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=8.0",
]

[project.scripts]
feedback-triage-agent = "feedback_triage_agent.cli:main"

[tool.setuptools.packages.find]
include = ["feedback_triage_agent*"]

[tool.setuptools.package-data]
feedback_triage_agent = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
